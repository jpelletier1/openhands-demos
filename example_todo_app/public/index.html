<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <div class="list-name-row">
        <h1 id="list-name" class="list-name">My Todo List</h1>
        <button id="edit-name-btn" class="btn btn-secondary" aria-label="Edit list name">Rename</button>
      </div>
      <form id="rename-form" class="rename-form hidden">
        <input type="text" id="list-name-input" placeholder="Enter new list name" maxlength="60" required>
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" id="cancel-rename-btn" class="btn btn-secondary">Cancel</button>
      </form>
    </header>

    <form id="todo-form" class="todo-form">
      <input type="text" id="todo-input" placeholder="What needs to be done?" maxlength="200" required>
      <button type="submit" class="btn btn-primary">Add Todo</button>
    </form>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state">No todos yet. Add one above!</p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
